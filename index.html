<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分類作業</title>
<style>
  /* ===== 版面樣式：手機與電腦共用 ===== */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size: 18px; line-height: 1.7; color: #1b1f3b; background: #fff;
  }
  main { max-width: 600px; margin: 0 auto; padding: 16px; min-height: 100vh; display: flex; flex-direction: column; }
  h1 { font-size: 24px; color: #1d3f8f; margin: 8px 0 12px; }
  section { display: flex; flex-direction: column; flex: 1; }
  [hidden] { display: none !important; }

  /* 一般按鈕（同意、開始這一段） */
  .btn {
    font: inherit; font-weight: 700; width: 100%; padding: 14px; margin-top: 16px;
    border: 0; border-radius: 12px; background: #1d3f8f; color: #fff; cursor: pointer;
  }

  /* 輸入欄位與資料顯示框 */
  input, textarea {
    font: inherit; width: 100%; padding: 8px 10px;
    border: 1px solid #5a6080; border-radius: 8px;
  }
  textarea { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.4; }

  /* 左右類別標籤 */
  .labels { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .label {
    border: 2px solid #1d3f8f; border-radius: 10px; padding: 8px 10px;
    font-weight: 700; color: #1d3f8f; min-height: 64px; line-height: 1.4;
  }
  .label.right { text-align: right; border-color: #6b3fa0; color: #6b3fa0; }
  .label .or { font-weight: 400; color: #5a6080; font-size: 15px; }

  /* 字詞出現的區域 */
  #stage {
    flex: 1; min-height: 180px; margin: 12px 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 1px solid #d5d9ea; border-radius: 12px;
  }
  #stim { font-size: 42px; font-weight: 700; min-height: 60px; }
  #err { color: #d32f2f; font-size: 36px; font-weight: 700; min-height: 54px; }

  /* 畫面下方的「左邊」「右邊」大按鈕 */
  .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-bottom: 8px; }
  .side {
    font: inherit; font-size: 22px; font-weight: 700; padding: 30px 6px;
    border: 0; border-radius: 14px; color: #fff; background: #1d3f8f; cursor: pointer;
    touch-action: manipulation; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .side.right { background: #6b3fa0; }
  .side:active { opacity: .8; }
  .key { display: block; font-size: 14px; font-weight: 400; opacity: .85; }
</style>
</head>
<body>
<main>
  <!-- 畫面一：同意說明與受測者代碼 -->
  <section id="consentScreen">
    <h1>分類作業</h1>
    <p>這份作業大約需要 5 分鐘。你會看到一個一個的字詞，請依照畫面上的規則，把每個字詞分到左邊或右邊。</p>
    <p>作答內容只用於研究，不會記錄你的姓名。你可以隨時停止作答。按下下方的按鈕，表示你同意參加。</p>
    <p>受測者代碼（沒有代碼可以留白）：</p>
    <input id="pidInput" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn" id="agreeBtn">我同意參加，開始作答</button>
  </section>

  <!-- 畫面二：每個區段開始前的規則說明 -->
  <section id="briefScreen" hidden>
    <h1 id="briefTitle"></h1>
    <p>請把中間出現的字詞分到左邊或右邊。屬於左邊類別的字詞，請按「左邊」（電腦可以按 E 鍵）；屬於右邊類別的字詞，請按「右邊」（電腦可以按 I 鍵）。</p>
    <p>按錯時會出現紅色的 ✕，請改按另一邊才能繼續。請盡量又快又正確。</p>
    <div class="labels"><div class="label" id="briefLeft"></div><div class="label right" id="briefRight"></div></div>
    <button class="btn" id="startBlockBtn">開始這一段</button>
  </section>

  <!-- 畫面三：作答畫面 -->
  <section id="playScreen" hidden>
    <div class="labels"><div class="label" id="playLeft"></div><div class="label right" id="playRight"></div></div>
    <div id="stage"><div id="stim"></div><div id="err"></div></div>
    <div class="sides">
      <button class="side" id="leftBtn">左邊<span class="key">E</span></button>
      <button class="side right" id="rightBtn">右邊<span class="key">I</span></button>
    </div>
  </section>

  <!-- 畫面四：結束畫面 -->
  <section id="doneScreen" hidden>
    <h1>作答完成，謝謝你</h1>
    <p id="doneText"></p>
    <textarea id="csvBox" rows="14" readonly hidden></textarea>
  </section>
</main>

<script>
// ===== 資料接收網址：貼上 Google Apps Script 的網址；空字串時，結束後在畫面上顯示 CSV =====
const ENDPOINT = "https://script.google.com/macros/s/AKfycbwsLwfFIZFmKIWUbGyLZSxBm3z7edoYGLkSdvKMyiUq37Zr4CGfBKluGI4CZqrhduG3NA/exec";

// ===== 類別與字詞 =====
// category 的代碼：concept1 = 概念 1、concept2 = 概念 2、attr1 = 正向屬性、attr2 = 負向屬性
const CATS = {
  concept1: { label: "高個子", words: ["高挑", "高大", "修長", "高個兒"] },
  concept2: { label: "矮個子", words: ["矮小", "嬌小", "低矮", "矮個兒"] },
  attr1:    { label: "高能力", words: ["勝任", "專業", "能幹", "優秀"] },
  attr2:    { label: "低能力", words: ["無能", "生疏", "拙劣", "平庸"] }
};

// ===== 隨機決定先做哪一種配對 =====
// order = 1：先做配對 A（高個子與高能力在左）；order = 2：先做配對 B（高個子與低能力在右）
const ORDER = Math.random() < 0.5 ? 1 : 2;
const FIRST = ORDER === 1 ? "A" : "B";
const SECOND = ORDER === 1 ? "B" : "A";

// 屬性的左右位置固定：高能力在左、低能力在右
// 配對 A：高個子在左、矮個子在右；配對 B：高個子在右、矮個子在左
function conceptSides(pairing) {
  return pairing === "A"
    ? { left: "concept1", right: "concept2" }
    : { left: "concept2", right: "concept1" };
}

// ===== 七個區段的設定 =====
// left / right：該邊包含哪些類別；pairing 在區段 1、2、5 是空白
function buildBlocks() {
  const c1 = conceptSides(FIRST);   // 第一種配對的概念位置（區段 1、3、4）
  const c2 = conceptSides(SECOND);  // 互換後的概念位置（區段 5、6、7）
  return [
    { block: 1, n: 20, phase: "single",   pairing: "",     left: [c1.left],          right: [c1.right] },
    { block: 2, n: 20, phase: "single",   pairing: "",     left: ["attr1"],          right: ["attr2"] },
    { block: 3, n: 20, phase: "practice", pairing: FIRST,  left: [c1.left, "attr1"], right: [c1.right, "attr2"] },
    { block: 4, n: 40, phase: "test",     pairing: FIRST,  left: [c1.left, "attr1"], right: [c1.right, "attr2"] },
    { block: 5, n: 20, phase: "single",   pairing: "",     left: [c2.left],          right: [c2.right] },
    { block: 6, n: 20, phase: "practice", pairing: SECOND, left: [c2.left, "attr1"], right: [c2.right, "attr2"] },
    { block: 7, n: 40, phase: "test",     pairing: SECOND, left: [c2.left, "attr1"], right: [c2.right, "attr2"] }
  ];
}
const BLOCKS = buildBlocks();

// ===== 小工具 =====
// 打亂陣列順序（Fisher–Yates 洗牌）
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 從幾個類別中抽出 count 個字詞：把全部字詞洗牌後依序取用，用完再重新洗牌，讓每個字詞出現的次數平均
function drawWords(catList, count) {
  const pool = [];
  catList.forEach(c => CATS[c].words.forEach(w => pool.push({ category: c, stimulus: w })));
  const out = [];
  while (out.length < count) out.push(...shuffle(pool));
  return out.slice(0, count);
}

// 產生一個區段的所有試次
function makeTrials(b) {
  const cats = b.left.concat(b.right);
  const concepts = cats.filter(c => c.startsWith("concept"));
  const attrs = cats.filter(c => c.startsWith("attr"));
  if (b.phase === "single") return drawWords(cats, b.n);
  // 合併作業：概念字詞與屬性字詞輪流出現（概念、屬性、概念、屬性……）
  const cList = drawWords(concepts, b.n / 2);
  const aList = drawWords(attrs, b.n / 2);
  const out = [];
  for (let i = 0; i < b.n / 2; i++) out.push(cList[i], aList[i]);
  return out;
}

// 把類別名稱組成標籤的 HTML（合併作業時中間加上「或」）
function labelHTML(catList) {
  return catList.map(c => CATS[c].label).join('<br><span class="or">或</span><br>');
}

// 切換顯示的畫面
function show(id) {
  ["consentScreen", "briefScreen", "playScreen", "doneScreen"].forEach(s => {
    document.getElementById(s).hidden = (s !== id);
  });
}

// 產生隨機的受測者代碼（例如 R7K2Q9XA）
function randomId() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let s = "R";
  for (let i = 0; i < 7; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

// ===== 作答的狀態 =====
let participantId = "";
let blockIndex = 0;      // 目前是第幾個區段（從 0 開始）
let trials = [];         // 目前區段的試次清單
let trialIndex = 0;      // 目前是第幾個試次（從 0 開始）
let onset = 0;           // 字詞出現的時間
let hadError = false;    // 這個試次是否曾經按錯
let accepting = false;   // 目前是否接受按鍵
const DATA = [];         // 全部的資料

// ===== 開始：同意後讀取代碼 =====
document.getElementById("agreeBtn").addEventListener("click", () => {
  const typed = document.getElementById("pidInput").value.trim();
  participantId = typed || randomId();   // 沒有輸入代碼時自動產生
  blockIndex = 0;
  showBrief();
});

// ===== 區段開始前：顯示這一段的左右規則 =====
function showBrief() {
  const b = BLOCKS[blockIndex];
  document.getElementById("briefTitle").textContent = "第 " + b.block + " 段（共 " + BLOCKS.length + " 段）";
  document.getElementById("briefLeft").innerHTML = "左邊：<br>" + labelHTML(b.left);
  document.getElementById("briefRight").innerHTML = "右邊：<br>" + labelHTML(b.right);
  show("briefScreen");
}

// 受測者按下「開始這一段」才開始
document.getElementById("startBlockBtn").addEventListener("click", startBlock);

function startBlock() {
  const b = BLOCKS[blockIndex];
  trials = makeTrials(b);
  trialIndex = 0;
  document.getElementById("playLeft").innerHTML = labelHTML(b.left);
  document.getElementById("playRight").innerHTML = labelHTML(b.right);
  document.getElementById("stim").textContent = "";
  document.getElementById("err").textContent = "";
  show("playScreen");
  setTimeout(nextTrial, 500);   // 稍等一下再出現第一個字詞
}

// ===== 呈現一個字詞並開始計時 =====
function nextTrial() {
  hadError = false;
  document.getElementById("err").textContent = "";
  document.getElementById("stim").textContent = trials[trialIndex].stimulus;
  // 等畫面真的畫出字詞後才開始計時
  requestAnimationFrame(() => {
    onset = performance.now();
    accepting = true;
  });
}

// ===== 處理按鍵（side 是 "left" 或 "right"） =====
function respond(side) {
  if (!accepting) return;
  const b = BLOCKS[blockIndex];
  const t = trials[trialIndex];
  const correctSide = b.left.includes(t.category) ? "left" : "right";

  // 按錯：顯示紅色提示，等受測者改按正確的一邊
  if (side !== correctSide) {
    hadError = true;
    document.getElementById("err").textContent = "✕";
    return;
  }

  // 按對：計算反應時間（從字詞出現到按對為止），記錄一筆資料
  const rt = performance.now() - onset;
  accepting = false;
  DATA.push({
    participant_id: participantId,
    order: ORDER,
    block: b.block,
    pairing: b.pairing,
    phase: b.phase,
    trial: trialIndex + 1,
    category: t.category,
    stimulus: t.stimulus,
    correct: hadError ? 0 : 1,
    rt_ms: Math.round(rt)
  });

  // 清空畫面，短暫停頓後進入下一個字詞或下一個區段
  document.getElementById("stim").textContent = "";
  document.getElementById("err").textContent = "";
  trialIndex++;
  if (trialIndex < trials.length) {
    setTimeout(nextTrial, 250);
  } else {
    blockIndex++;
    if (blockIndex < BLOCKS.length) setTimeout(showBrief, 250);
    else finish();
  }
}

// ===== 輸入方式：畫面按鈕與 E / I 鍵 =====
// 用 pointerdown 讓手機的觸控反應更即時
document.getElementById("leftBtn").addEventListener("pointerdown", e => { e.preventDefault(); respond("left"); });
document.getElementById("rightBtn").addEventListener("pointerdown", e => { e.preventDefault(); respond("right"); });
document.addEventListener("keydown", e => {
  if (e.repeat || document.getElementById("playScreen").hidden) return;   // 只在作答畫面接受按鍵，忽略長按的重複
  const k = e.key.toLowerCase();
  if (k === "e") respond("left");
  else if (k === "i") respond("right");
});

// ===== 結束：送出資料或顯示 CSV =====
const FIELDS = ["participant_id", "order", "block", "pairing", "phase", "trial", "category", "stimulus", "correct", "rt_ms"];

function toCSV(rows) {
  const lines = [FIELDS.join(",")];
  rows.forEach(r => lines.push(FIELDS.map(f => r[f]).join(",")));
  return lines.join("\n");
}

function finish() {
  show("doneScreen");
  const doneText = document.getElementById("doneText");

  // ENDPOINT 是空字串：把資料以 CSV 顯示在畫面上
  if (ENDPOINT === "") {
    doneText.textContent = "目前沒有設定 ENDPOINT，以下是本次的資料（CSV）：";
    const box = document.getElementById("csvBox");
    box.value = toCSV(DATA);
    box.hidden = false;
    return;
  }

  // 有設定 ENDPOINT：用 POST 送出 JSON
  doneText.textContent = "資料傳送中，請稍候，不要關閉這個頁面……";
  fetch(ENDPOINT, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({ id: participantId, order: ORDER, trials: DATA })
  })
    .then(() => { doneText.textContent = "資料已送出，現在可以關閉這個頁面。"; })
    .catch(() => { doneText.textContent = "資料傳送失敗，請不要關閉這個頁面，並通知研究人員。"; });
}
</script>
</body>
</html>
